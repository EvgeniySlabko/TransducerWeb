<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Demo Progressive Web Application</title>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta
			name="description"
			content="This a Demo Progressive Web Application which will work in offline, has a splash screen add to home screen etc,."
		/>
		
		<!-- Latest compiled and minified CSS -->
		<link rel="stylesheet" href="./src/css/css/bootstrap-grid.rtl.min.css">
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<meta name="theme-color" content="#29434d" />
		<meta name="msapplication-TileColor" content="#29434d" />
		<meta name="msapplication-TileImage" content="./images/icons/mstile-150x150.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Progressive Web Application" />
		<meta name="application-name" content="Progressive Web Application" />	
	<script defer src="bundle.js"></script></head>

	<body>
		<div class="container">
			<h2>Modal Login Example</h2>
			<!-- Trigger the modal with a button -->
			<button type="button" class="btn btn-default btn-lg" id="myBtn">Login</button>
		  
			<!-- Modal -->
			<div class="modal fade" id="myModal" role="dialog">
			  <div class="modal-dialog">
		  
				<!-- Modal content-->
				<div class="modal-content">
				  <div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">&times;</button>
					<h4 style="color:red;"><span class="glyphicon glyphicon-lock"></span> Login</h4>
				  </div>
				  <div class="modal-body">
					<form role="form">
					  <div class="form-group">
						<label for="usrname"><span class="glyphicon glyphicon-user"></span> Username</label>
						<input type="text" class="form-control" id="usrname" placeholder="Enter email">
					  </div>
					  <div class="form-group">
						<label for="psw"><span class="glyphicon glyphicon-eye-open"></span> Password</label>
						<input type="text" class="form-control" id="psw" placeholder="Enter password">
					  </div>
					  <div class="checkbox">
						<label><input type="checkbox" value="" checked>Remember me</label>
					  </div>
					  <button type="submit" class="btn btn-default btn-success btn-block"><span class="glyphicon glyphicon-off"></span> Login</button>
					</form>
				  </div>
				  <div class="modal-footer">
					<button type="submit" class="btn btn-default btn-default pull-left" data-dismiss="modal"><span class="glyphicon glyphicon-remove"></span> Cancel</button>
					<p>Not a member? <a href="#">Sign Up</a></p>
					<p>Forgot <a href="#">Password?</a></p>
				  </div>
				</div>
			  </div>
			</div>
		  </div>
		
		
		  <div class="btn-toolbar"   aria-label="Toolbar with button groups">
			<div class="btn-group mr-2" role="group" aria-label="First group">
			  <button type="button" class="btn btn-secondary" id="Start">Start</button>
			  <button type="button" class="btn btn-secondary" id="Stop">Stop</button>
			  <button type="button" class="btn btn-secondary">3</button>
			  <button type="button" class="btn btn-secondary">4</button>
			</div>
			<div class="btn-group mr-2" role="group" aria-label="Second group">
			  <button type="button" class="btn btn-secondary">5</button>
			  <button type="button" class="btn btn-secondary">6</button>
			  <button type="button" class="btn btn-secondary">7</button>
			</div>
			<div class="btn-group" role="group" aria-label="Third group">
			  <button type="button" class="btn btn-secondary">8</button>
			</div>
		  </div>

		  <div>fps: <span id="fps"></span></div>
		<div id="gd" class="resizable"></div>
		
		<div class="btn-group">
			<button id="Stop">Stop</button>
			<button id="Start">Start</button>
			<button id="removeDataset">Remove Dataset</button>
			<button id="Sync">Sync</button>
			<button class="button" id="open">Тык!</button>

		</div>

		<!-- JS Files  -->
		
		<script>var exports = {};</script>		
		
</html>
